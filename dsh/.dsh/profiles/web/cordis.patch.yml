# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    baseURL: https://llm.oasm.dev/v1
    models:
      - id: auto
        name: Auto
        contextWindow: 1048576
        systemPromptUpdate: in-history
        toolUpdate: addition-only
        inputModalities:
          - text
          - image
      - id: pro
        name: Pro
        description:
          Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1048576
        inputModalities:
          - text
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: auto
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
    fontSize: 18
- insert:
    - id: mcp-github
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: !!js "`Bearer ${process.env.GITHUB_MCP_TOKEN}`"
    - id: mcp-context7
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        headers: !!js "process.env.CONTEXT7_API_KEY ? { Authorization: `Bearer ${process.env.CONTEXT7_API_KEY}` } : {}"
    - id: mcp-playwright
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: playwright
        transport: stdio
        command: npx
        args:
          - "@playwright/mcp@0.0.84"
          - "--executable-path"
          - "/usr/bin/chromium-browser"
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: standard
